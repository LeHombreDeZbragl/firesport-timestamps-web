# fly.toml app configuration file generated for firesport-timestamps-web on 2026-05-25T13:19:34+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'firesport-times'
primary_region = 'fra'

[build]

[env]
  NODE_ENV = 'production'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # 0 lets every machine autostop while idle; the proxy holds the first request
  # during the ~1 s wake. Setting this to 1 pins a machine 24/7 at ~$3.32/month.
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    path = '/api/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
