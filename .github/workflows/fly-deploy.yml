name: Deploy to fly.io

on:
  push:
    branches:
      - main          # auto-deploy on every push to main

jobs:
  test:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Installs all workspace deps from the lockfile.
      - run: npm ci

      # Server API test suite. Mocks Supabase, so it needs no database or secrets.
      - run: npm test

  deploy:
    name: Deploy
    needs: test          # deploy only if the test suite passes
    runs-on: ubuntu-latest
    # Prevent two deploys from racing if pushes happen in quick succession
    concurrency: deploy-group

    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # --remote-only  →  the Docker build runs on fly.io's remote builders,
      # not on the GitHub Actions runner. Faster and no Docker-in-Docker needed.
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
